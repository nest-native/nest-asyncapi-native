name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-build:
    name: Package build/typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/asyncapi

      - name: Typecheck package
        run: npm run typecheck --workspace @nest-native/asyncapi

  package-test-node-20:
    name: Package tests/coverage (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov

  package-quality:
    name: Tests, coverage, and complexity (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Restore base branch CI data
        if: github.event_name == 'pull_request'
        id: base-ci-data
        uses: actions/cache/restore@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.base_ref }}-
          restore-keys: ci-data-node-22-${{ github.base_ref }}-

      - name: Extract base CI data
        if: steps.base-ci-data.outputs.cache-matched-key
        run: |
          cp ci-data/coverage-summary.json base-coverage-summary.json 2>/dev/null || true
          cp ci-data/test-results.json base-test-results.json 2>/dev/null || true
          cp ci-data/test-step-duration-ms.txt base-test-step-duration-ms.txt 2>/dev/null || true
          cp ci-data/cognitive-complexity-summary.json base-cognitive-complexity-summary.json 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          START=$SECONDS
          npm run test:cov
          echo $(( (SECONDS - START) * 1000 )) > test-step-duration-ms.txt

      - name: Enforce cognitive complexity threshold
        run: npm run complexity:check

      - name: Generate cognitive complexity report
        run: npm run complexity:report

      - name: Generate base cognitive complexity fallback
        if: github.event_name == 'pull_request'
        run: |
          if [ -f base-cognitive-complexity-summary.json ]; then
            exit 0
          fi

          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_DIR/node_modules"
          (
            cd "$BASE_DIR"
            if [ -f scripts/collect-cognitive-complexity.mjs ]; then
              node scripts/collect-cognitive-complexity.mjs \
                --output "$GITHUB_WORKSPACE/base-cognitive-complexity-summary.json"
            fi
          )

      - name: Cache CI data for base branch
        if: github.event_name == 'push'
        run: |
          mkdir -p ci-data
          cp coverage/coverage-summary.json ci-data/coverage-summary.json
          cp test-results.json ci-data/test-results.json
          cp test-step-duration-ms.txt ci-data/test-step-duration-ms.txt
          cp complexity/cognitive-complexity-summary.json ci-data/cognitive-complexity-summary.json

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.ref_name }}-${{ github.sha }}

      - name: Get changed files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/**/*.ts' | tee changed-files.txt

      - name: Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/coverage-report.js');
            await report({ github, context, core });

      - name: Performance Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/performance-report.js');
            await report({ github, context, core });

      - name: Complexity Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/complexity-report.js');
            await report({ github, context, core });

      - name: Coverage and performance summary
        run: |
          node -e "
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const duration = fs.readFileSync('test-step-duration-ms.txt', 'utf8').trim();
          const metrics = {
            statements: summary.statements.pct,
            branches: summary.branches.pct,
            functions: summary.functions.pct,
            lines: summary.lines.pct,
          };
          const report = [
            '### Package Quality',
            '',
            '| Metric | Value |',
            '| :--- | ---: |',
            '| Statements | ' + metrics.statements + '% |',
            '| Branches | ' + metrics.branches + '% |',
            '| Functions | ' + metrics.functions + '% |',
            '| Lines | ' + metrics.lines + '% |',
            '| Test step duration | ' + duration + ' ms |',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          "

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-quality
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            complexity/cognitive-complexity-summary.json
            test-results.json
            test-step-duration-ms.txt
          if-no-files-found: error

  release-and-security:
    name: Release and security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate package tarball
        run: npm run release:check

      - name: Audit production supply chain
        run: npm run security:audit

  samples:
    name: Sample validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/asyncapi

      - name: Run sample matrix
        run: |
          START=$SECONDS
          npm run ci:sample
          echo $(( (SECONDS - START) * 1000 )) > sample-validation-duration-ms.txt

      - name: Sample matrix summary
        run: |
          DURATION_MS="$(cat sample-validation-duration-ms.txt)"
          DURATION_SECONDS="$(node -e "console.log((Number(process.argv[1]) / 1000).toFixed(2))" "$DURATION_MS")"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### AsyncAPI Sample Matrix

          | Metric | Value |
          | :--- | ---: |
          | Sample validation duration | DURATION_PLACEHOLDER |

          | Sample | Demonstrates | CI behavior |
          | :--- | :--- | :--- |
          | `00-showcase` | All decorators with class-validator and Zod payloads, Kafka and NATS bindings, and the docs route with viewer, validated by `@asyncapi/parser` | Boots the app, asserts the document, and serves the docs route over HTTP |
          | `01-validation-class-validator` | `@AsyncApiMessage` / `@AsyncApiHeaders` with class-validator DTOs | Boots the app and validates the document with `@asyncapi/parser` |
          | `02-validation-zod` | `@AsyncApiMessage` with a Zod payload via `zod-to-json-schema` | Boots the app and validates the document with `@asyncapi/parser` |
          | `03-transport-bindings` | `@AsyncApiServer` and Kafka, NATS, MQTT, and AMQP bindings across servers, channels, operations, and messages | Boots the app and validates the document with `@asyncapi/parser` |
          | `04-docs-route` | `AsyncApiModule.setup` serving the viewer page and the JSON/YAML spec routes | Boots the app over HTTP and validates the served JSON and YAML with `@asyncapi/parser` |
          | `05-migration-nestjs-asyncapi` | The `nestjs-asyncapi` 2.x felines sample ported to AsyncAPI 3.0: channel/operation split, `@EventPattern` coexistence, slash channel ids, and polymorphic payloads | Boots the app, asserts the migration is faithful, and validates the document with `@asyncapi/parser` |
          | `06-forrootasync-config` | `AsyncApiModule.forRootAsync` resolving the document defaults from an injected `ConfigService` | Boots the app, asserts the async config seeded the document, and validates it with `@asyncapi/parser` |
          EOF
          sed -i "s/DURATION_PLACEHOLDER/${DURATION_SECONDS}s (${DURATION_MS}ms)/" "$GITHUB_STEP_SUMMARY"

  nestjs-latest-major:
    name: NestJS 12 compatibility (Node 22)
    runs-on: ubuntu-latest
    # The published peer range allows @nestjs/common and @nestjs/core
    # ^11 || ^12, but the devDependencies and the lockfile stay on 11 so the
    # jobs above keep testing that end. This leg installs the 12 set on top
    # with --no-save and is what makes the 12 end a tested claim rather than
    # an assumption. Three details are load-bearing:
    #   - `--workspaces --include-workspace-root`, not `--workspace-root`: the
    #     samples pin @nestjs/* exactly, so with the latter npm satisfies each
    #     sample's own 11 pin by nesting an 11 copy under sample/*/node_modules
    #     and the sample matrix silently runs on 11 while the root reports 12.
    #     The check script below fails the leg if any workspace resolves
    #     another major or a nested copy.
    #   - every @nestjs/* package any workspace declares is listed, in ONE
    #     command. --no-save never persists the 12 edges, so a second
    #     `npm install` would reconcile the tree back to the 11 lockfile; and
    #     @nestjs/swagger and @nestjs/microservices peer on common/core ^12 at
    #     12, so leaving either on 11 is an ERESOLVE, not a mixed tree.
    #   - the version print reads the manifest by path: the 12 exports map
    #     routes `./*` to `./*.js`, so `require('@nestjs/core/package.json')`
    #     throws on 12.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install with NestJS 12
        run: |
          npm install --no-save --workspaces --include-workspace-root \
            @nestjs/common@^12.0.0 @nestjs/core@^12.0.0 \
            @nestjs/platform-express@^12.0.0 @nestjs/testing@^12.0.0 \
            @nestjs/swagger@^12.0.0 @nestjs/microservices@^12.0.0
          node -e "console.log('@nestjs/core', require('./node_modules/@nestjs/core/package.json').version)"

      - name: Prove every workspace resolves NestJS 12
        run: node scripts/check-resolved-nestjs-major.mjs 12

      # The build comes first: the samples import @nest-native/asyncapi through
      # the workspace link, whose entry points live in packages/asyncapi/dist,
      # so the workspace-wide typecheck below needs the package built.
      - name: Build package against NestJS 12
        run: npm run build --workspace @nest-native/asyncapi

      - name: Typecheck every workspace against NestJS 12
        run: npm run typecheck

      - name: Run the suite against NestJS 12
        run: npm test

      - name: Run sample matrix against NestJS 12
        run: npm run ci:sample

  docs-site:
    name: Docusaurus build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs website dependencies
        run: npm --prefix website ci

      - name: Build docs site
        run: npm --prefix website run build
